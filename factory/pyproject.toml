[project]
name = "feedback-factory"
version = "0.1.0"
description = "Phase 1: Google review ingest for the Feedback → Feature Factory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
explore = "explore:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: ship the two modules at the project root
only-include = ["explore.py", "schema.py"]

[tool.hatch.build.targets.wheel.force-include]
"explore.py" = "explore.py"
"schema.py" = "schema.py"
